# Production on the server behind Caddy. Deploy with deploy-server.ps1.
# Caddy forwards the domain to 127.0.0.1:${APP_PORT}.
# ~/reshet-mishkafaim/.env on the server must set ADMIN_PASSWORD (at least 16 characters).
name: reshet-mishkafaim
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: reshet-mishkafaim-prod
    restart: unless-stopped
    ports:
      # Only Caddy on this server reaches the app; the outside world goes through Caddy (HTTPS).
      # Until there is a domain, APP_BIND=0.0.0.0 and COOKIE_SECURE=false in .env open http://SERVER_IP:3060 directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3060}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in ~/reshet-mishkafaim/.env (at least 16 characters)}
      # The admin login cookie is HTTPS-only behind Caddy.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Caddy passes the visitor's IP, so rate limits apply per visitor and not to everyone at once.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      # The bookings database. Survives rebuilds and updates; `down -v` deletes it.
      - bookings:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bookings:
    name: reshet_mishkafaim_bookings
